name = "personal-dashboard-api"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# The "personal-dashboard-api-TOKENS" namespace this id points at already
# exists in the account. Local `wrangler dev` ignores it and uses a local
# emulated namespace; deploys read and write the real one.
[[kv_namespaces]]
binding = "TOKENS"
id = "842181f59c2043c6a87c5d7d11c8f574"

# Non-secret configuration. Secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# DASHBOARD_PASSWORD, SESSION_SECRET) are set with `wrangler secret put NAME`
# instead — see README. Uncomment and edit the ones you need; `vars` here are
# visible to anyone who can read this repo, so nothing sensitive belongs here.
[vars]
ALLOWED_ORIGINS = "https://shrlak.github.io"
# ICLOUD_ICS_URLS = ""
# NEWS_FEEDS_KO = ""
# NEWS_FEEDS_EN = ""
# PUBLIC_URL = ""
