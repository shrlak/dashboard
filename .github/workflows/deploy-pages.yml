# Builds the frontend on every push to main and publishes dist/ to the
# gh-pages branch. One-time setup: repo Settings → Pages → Source:
# "Deploy from a branch" → Branch: gh-pages / (root).
#
# Note: Pages only hosts the frontend. Point it at the deployed Cloudflare
# Worker by setting the API_BASE repository variable (Settings → Secrets and
# variables → Actions → Variables) to the Worker's URL, e.g.
# https://personal-dashboard-api.<you>.workers.dev. Without it the panels
# show sample data until a backend URL is entered on the Connections tab.
name: Publish to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # API_BASE is the hosted backend's URL; the dashboard reads all live
      # data from it, so nothing has to run on your own machine.
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
      - name: Push dist/ to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
