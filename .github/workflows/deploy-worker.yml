# Deploys the backend Worker on every push to main. One-time setup (see
# README): create the Workers KV namespace and paste its id into
# wrangler.toml, set the Worker's secrets with `wrangler secret put`, and
# add these two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    — a token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID   — found on the right sidebar of any page in the
#                             Cloudflare dashboard
name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
